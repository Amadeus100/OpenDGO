paths:
  q1_data_root: ../Q1_Organization_Benchmark/data
  graph_library_root: graph_library/generated
  trace_annotation_root: data
  results_root: results/q3_smoke

llm:
  base_url: http://127.0.0.1:8993/v1
  api_key: EMPTY
  model: Qwen3-VL-8B-Instruct
  temperature: 0.0
  max_tokens: 256
  final_max_tokens: 512
  timeout_seconds: 120
  request_retries: 1
  max_concurrent_requests: 2

experiment:
  domains: [finance]
  task_structures: [sequential_dependency]
  seeds: [101]
  tasks_per_cell: 2
  variant_graph_count: 2
  matched_pairs_per_property: 2
  communication_rounds: 1
  communication_budget_chars: 2000
  max_total_tokens: 6000
  final_token_reserve: 512
  max_messages: 40
  parse_repair_attempts: 1
  repeat_limit: 3
  unchanged_round_limit: 2
  record_message_content: true
  duplicate_jaccard_threshold: 0.90
  bootstrap_resamples: 1000
  bootstrap_seed: 2026

executors:
  coding:
    command: []
    timeout_seconds: 7200

