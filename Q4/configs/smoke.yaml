paths:
  q1_data_root: ../Q1_Organization_Benchmark/data
  results_root: results/smoke
llm:
  base_url: http://127.0.0.1:8993/v1
  api_key: EMPTY
  model: Qwen3-VL-8B-Instruct
  temperature: 0.2
  max_tokens: 700
  final_max_tokens: 1800
  timeout_seconds: 600
  request_retries: 1
  max_concurrent_requests: 2
experiment:
  domains: [finance]
  task_structures: [sequential_dependency]
  organizations: [star, ring]
  seeds: [101]
  tasks_per_cell: 2
  synthesizer_node: 0
  communication_rounds: 5
  communication_budget_chars: 6000
  natural_max_total_tokens: 24000
  final_token_reserve: 1800
  max_messages: 180
  parse_repair_attempts: 1
  repeat_limit: 3
  unchanged_round_limit: 2
  record_message_content: true
  token_caps: [6000, 24000]
  fault_pressures_percent: [0, 20]
  fault_agent_probability: 0.5
  fault_channel_probability: 0.5
  bootstrap_resamples: 100
  bootstrap_seed: 2026
executors:
  coding:
    command: []
    timeout_seconds: 7200
