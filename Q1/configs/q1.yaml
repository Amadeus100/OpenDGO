paths:
  data_root: data
  results_root: results/q1
  learned_graph_root: learned_graphs

llm:
  base_url: http://127.0.0.1:8993/v1
  api_key: EMPTY
  model: Qwen3-VL-8B-Instruct
  temperature: 0.2
  max_tokens: 700
  final_max_tokens: 1800
  timeout_seconds: 600
  request_retries: 1
  max_concurrent_requests: 6

experiment:
  domains:
    - coding
    - finance
    - biomedical
    - legal
    - scientific_research
    - recommendation
  task_structures:
    - sequential_dependency
    - parallel_decomposition
    - evidence_integration
  organizations:
    - single_agent
    - star
    - chain
    - tree
    - ring
    - mesh
    - community
    - g_designer
    - arg_designer
    - goagent
  seeds: [101, 203, 307, 409, 503]
  tasks_per_cell: 500
  synthesizer_node: 0
  communication_rounds: 5
  communication_budget_chars: 6000
  max_total_tokens: 24000
  final_token_reserve: 1800
  max_messages: 180
  parse_repair_attempts: 1
  repeat_limit: 3
  unchanged_round_limit: 2
  record_message_content: true

# Coding must be executed by a repository-aware program that returns an official
# SWE-bench harness record. An empty command makes the runner fail before any LLM
# call instead of producing an invalid proxy score.
executors:
  coding:
    command: []
    timeout_seconds: 7200

